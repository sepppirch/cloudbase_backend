<script>
    //track mouse position on mousemove
    var mousePosition;
    //track state of mousedown and up
    var isMouseDown;

    //reference to the canvas element
    var c = document.getElementById("myCanvas");
    var parent = c;
    //reference to 2d context
    var ctx = c.getContext("2d");

    //add listeners
    document.addEventListener('mousemove', move, false);
    document.addEventListener('mousedown', setDraggable, false);
    document.addEventListener('mouseup', setDraggable, false);

    //make some circles
    var c1 = new Circle(0, 50, 10, "blue", "black");
    var c2 = new Circle(100, 10, 10, "green", "black");
    var c3 = new Circle(300, 150, 10, "red", "black");
    var c4 = new Circle(400, 50, 10, "blue", "black");
    //make a collection of circles
    var circles = [c1, c2, c3, c4];
    console.log(c1.x);
    //main draw method

    Array.prototype.move = function (old_index, new_index) {
        if (new_index >= this.length) {
            var k = new_index - this.length;
            while ((k--) + 1) {
                this.push(undefined);
            }
        }
        this.splice(new_index, 0, this.splice(old_index, 1)[0]);
    };
    draw();

</script>
