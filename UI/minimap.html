			var m = Math.floor(time / 60 % 60);
			if (m < 10) {
				m = "0" + m;

			if (s < 10) {
				s = "0" + s;

		function test(point, vs) {
			// ray-casting algorithm based on
			// http://www.ecse.rpi.edu/Homepages/wrf/Research/Short_Notes/pnpoly.html

			var x = point[0], y = point[1];

			var inside = false;
			for (var i = 0, j = vs.length - 1; i < vs.length; j = i++) {
				var xi = vs[i][0], yi = vs[i][1];
				var xj = vs[j][0], yj = vs[j][1];

				var intersect = ((yi > y) != (yj > y))
					&& (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
				if (intersect) inside = !inside;
			}

			return inside;
		};

			//document.getElementById("debug").innerHTML = parseInt(coords.r).toString();
			if (lastcoords[0] != 0.0) {
				L.polyline([[lat, lon], lastcoords], { color: rgb(parseInt(coords.r), parseInt(coords.g), parseInt(coords.b)), fillOpacity: 0.3, strokewidth: 4 }).addTo(map);
			}
			lastcoords = [lat, lon];
		};
