<!DOCTYPE html>
<html>
<body>
       <canvas id = "myCanvas"  width="400" height="200" style="border:1px solid"></canvas>
</body>
<script>


    bezier = function(t, p0, p1, p2, p3){
      var cX = 3 * (p1.x - p0.x),
          bX = 3 * (p2.x - p1.x) - cX,
          aX = p3.x - p0.x - cX - bX;
            
      var cY = 3 * (p1.y - p0.y),
          bY = 3 * (p2.y - p1.y) - cY,
          aY = p3.y - p0.y - cY - bY;
            
      var x = (aX * Math.pow(t, 3)) + (bX * Math.pow(t, 2)) + (cX * t) + p0.x;
      var y = (aY * Math.pow(t, 3)) + (bY * Math.pow(t, 2)) + (cY * t) + p0.y;
            
      return {x: x, y: y};
    },

    (function(){
      var accuracy = 0.01, //this'll give the bezier 100 segments
          p0 = {x: 10, y: 10}, //use whatever points you want obviously
          p1 = {x: 50, y: 100},
          p2 = {x: 250, y: 100},
          p3 = {x: 300, y: 10},
          //reference to the canvas element

//reference to 2d context

          ctx = document.getElementById("myCanvas").getContext('2d');

            //ctx.width = 400;
            //ctx.height = 200;
            //document.body.appendChild(ctx.canvas);
            
            ctx.moveTo(p0.x, p0.y);
            for (var i=0; i<1; i+=accuracy){
                var p = bezier(i, p0, p1, p2, p3);
                ctx.lineTo(p.x, p.y);
            }
  
      ctx.stroke()
    })()

    var p0 = [10,10]; //use whatever points you want obviously
    var p1 = [50,100];
    var p2 = [250,100];
    var p3 = [300,10];
    var LUT_x = [], LUT_y = [], t, a, b, c, d;
    for(let i=0; i<10; i++) {
    t = i/10;
    a = (1-t)*(1-t)*(1-t);
    b = (1-t)*(1-t)*t;
    c = (1-t)*t*t;
    d = t*t*t;
    LUT_x.push( a*p0[0] + 3*b*p1[0] + 3*c*p2[0] + d*p3[0] );
    LUT_y.push( a*p0[1] + 3*b*p1[1] + 3*c*p2[1] + d*p3[1] );
    }
    console.log(p0[0]);
    console.log(LUT_y);
</script>
</html>
